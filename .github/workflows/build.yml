name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: AbaoSplitZip-Windows
            exe_name: AbaoSplitZip.exe
          - os: ubuntu-20.04
            artifact_name: AbaoSplitZip-Linux
            exe_name: AbaoSplitZip
          - os: macos-latest
            artifact_name: AbaoSplitZip-macOS
            exe_name: AbaoSplitZip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Linux libs (if Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller build.spec --clean --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.exe_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release
          
          # Windows
          cp artifacts/AbaoSplitZip-Windows/AbaoSplitZip.exe release/
          cd release && zip AbaoSplitZip-Windows.zip AbaoSplitZip.exe && rm AbaoSplitZip.exe && cd ..
          
          # Linux
          cp artifacts/AbaoSplitZip-Linux/AbaoSplitZip release/
          cd release && chmod +x AbaoSplitZip && tar czf AbaoSplitZip-Linux.tar.gz AbaoSplitZip && rm AbaoSplitZip && cd ..
          
          # macOS
          cp artifacts/AbaoSplitZip-macOS/AbaoSplitZip release/
          cd release && chmod +x AbaoSplitZip && tar czf AbaoSplitZip-macOS.tar.gz AbaoSplitZip && rm AbaoSplitZip && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AbaoSplitZip-Windows.zip
            release/AbaoSplitZip-Linux.tar.gz
            release/AbaoSplitZip-macOS.tar.gz
          generate_release_notes: true
