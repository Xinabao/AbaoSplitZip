name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: AbaoSplitZip-Windows
            exe_ext: .exe
          - os: ubuntu-22.04
            artifact: AbaoSplitZip-Linux
            exe_ext: ""
          - os: macos-latest
            artifact: AbaoSplitZip-macOS
            exe_ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller build.spec --clean --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/AbaoSplitZip${{ matrix.exe_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Package releases
        run: |
          cd AbaoSplitZip-Windows && zip ../AbaoSplitZip-Windows.zip * && cd ..
          cd AbaoSplitZip-Linux && chmod +x AbaoSplitZip && tar czf ../AbaoSplitZip-Linux.tar.gz * && cd ..
          cd AbaoSplitZip-macOS && chmod +x AbaoSplitZip && tar czf ../AbaoSplitZip-macOS.tar.gz * && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AbaoSplitZip-Windows.zip
            AbaoSplitZip-Linux.tar.gz
            AbaoSplitZip-macOS.tar.gz
          generate_release_notes: true
